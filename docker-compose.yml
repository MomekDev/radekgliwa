# Produkcja: kreator + Caddy (HTTPS). Lokalnie wystarczy: npm start
services:
  kreator:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      NODE_ENV: production
    volumes:
      - kreator-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - kreator
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  kreator-data:
  caddy-data:
  caddy-config:
